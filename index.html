<!DOCTYPE html>
<html>
<head>
  <title>HydroTrack</title>
  <style>
    body { text-align:center; font-family:Arial; background:#e0f7fa; }
    .dark { background:#121212; color:white; }
    button { padding:10px; margin:10px; }
    .progress-bar {
      width:80%; height:20px; background:#ccc; margin:auto;
    }
    .fill {
      height:100%; background:blue; width:0%;
    }
  </style>
</head>
<body>

<h1>HydroTrack 💧</h1>

<input id="goal" placeholder="Enter goal (glasses)">
<button onclick="setGoal()">Set Goal</button>

<h2 id="progress">0 / 0</h2>

<div class="progress-bar">
  <div class="fill" id="bar"></div>
</div>

<button onclick="addWater()">+1 Glass</button>
<button onclick="toggleDark()">Dark Mode</button>

<script>
let goal=0, count=0;

// Load saved data
window.onload = function(){
  goal = localStorage.getItem("goal") || 0;
  count = localStorage.getItem("count") || 0;
  updateUI();
}

function setGoal(){
  goal = document.getElementById("goal").value;
  localStorage.setItem("goal", goal);
  updateUI();
}

function addWater(){
  count++;
  localStorage.setItem("count", count);
  updateUI();

  if(count == goal){
    alert("Goal Complete! 🔥");
  }
}

function updateUI(){
  document.getElementById("progress").innerText = count + " / " + goal;
  let percent = (count/goal)*100;
  document.getElementById("bar").style.width = percent + "%";
}

// Reminder
setInterval(()=>{
  alert("Pani piyo 💧");
},1800000);

// Dark mode
function toggleDark(){
  document.body.classList.toggle("dark");
}
</script>

</body>
</html>
